version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=forensic-field-drug-testing-production-secret-key-2026
      - DATABASE_URL=sqlite:///data/field_evidence.db
    volumes:
      - ./backend/data:/app/data
      - ./backend/uploads:/app/uploads
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: ../infrastructure/docker/Dockerfile.web
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  evidence_data:
  evidence_uploads:
